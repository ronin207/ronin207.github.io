<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <!-- Apply the saved theme before first paint to avoid a light-mode flash for dark users -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <title>Takumi Otsuka | Post-Quantum Cryptography & AI Research</title>
    <meta name="description" content="Graduate researcher at Waseda University specializing in post-quantum cryptography, zero-knowledge proofs, and AI security. Building privacy-preserving systems for a quantum-resistant future." />
    <link rel="canonical" href="https://takumi.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Takumi Otsuka | Post-Quantum Cryptography & AI Research" />
    <meta property="og:description" content="Graduate researcher at Waseda University specializing in post-quantum cryptography, zero-knowledge proofs, and AI security." />
    <meta property="og:url" content="https://takumi.dev" />
    <meta property="og:site_name" content="TAKUMI.DEV" />

    <!-- Twitter Card — switch to summary_large_image once an og:image exists -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Takumi Otsuka | Post-Quantum Cryptography & AI Research" />
    <meta name="twitter:description" content="Graduate researcher at Waseda University specializing in post-quantum cryptography, zero-knowledge proofs, and AI security." />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Takumi Otsuka",
      "url": "https://takumi.dev",
      "jobTitle": "Graduate Researcher",
      "affiliation": [
        { "@type": "Organization", "name": "Waseda University" },
        { "@type": "Organization", "name": "AIFT" }
      ],
      "knowsAbout": ["Post-Quantum Cryptography", "Zero-Knowledge Proofs", "AI Security", "Verifiable Credentials"],
      "sameAs": [
        "https://github.com/ronin207",
        "https://linkedin.com/in/takumi-otsuka"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
